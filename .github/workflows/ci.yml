name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"   # feature branches get CI without opening a PR
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      # Python counterpart of `npm audit --audit-level=high` in build-frontend.
      # Audits the pins in backend/requirements.txt as written (no resolve, no
      # install) and fails on any ID not triaged in backend/pip-audit-ignore.txt.
      - name: Audit backend dependencies
        run: |
          python -m pip install --quiet pip-audit
          python backend/pip_audit_gate.py

      # data/dau_experiment.db is gitignored, and the fixture-integrity tests in
      # tests/test_sql_generation_eval.py open it read-only. Skipping them when it
      # is absent would let the eval's tables drift unnoticed, so build it here.
      - name: Generate DAU dataset
        run: python data/generate_data.py

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-that-is-long-enough-for-hs256
          PYTHONUNBUFFERED: "1"
        run: python -m pytest tests/ -q -m "not integration" --tb=short --disable-warnings

      - name: Compile backend modules
        run: python -m compileall backend agents auth config memory tools -q

  integration-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datapilot_test
          POSTGRES_USER: datapilot
          POSTGRES_PASSWORD: datapilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapilot -d datapilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Run Redis/Postgres integration tests
        env:
          SECRET_KEY: test-secret-key-that-is-long-enough-for-hs256
          PYTHONUNBUFFERED: "1"
          REDIS_URL: redis://127.0.0.1:6379/0
          DATAPILOT_POSTGRES_INTEGRATION: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: datapilot_test
          PGUSER: datapilot
          PGPASSWORD: datapilot
        run: python -m pytest tests/ -q -m integration --tb=short --disable-warnings

  eval-offline:
    runs-on: ubuntu-latest
    needs: [test-backend]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate DAU dataset
        run: python data/generate_data.py

      - name: Run offline evals against baseline
        run: python evals/compare_baseline.py

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://placeholder.example.com
        run: npm run build

      - name: TypeScript check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install Playwright browsers
        working-directory: frontend
        # `--with-deps` runs apt-get, and the runner image's default mirror
        # (azure.archive.ubuntu.com, selected via mirror+file:/etc/apt/
        # apt-mirrors.txt) has stalled mid-`apt-get update` with no timeout —
        # the step sat for 18 min until the job limit killed it, four runs in
        # a row on 2026-08-19 — while archive.ubuntu.com answered in the same
        # log. Pin apt to the canonical mirror, give it network timeouts, do
        # the apt-get update ourselves under a hard timeout (killing any
        # stalled apt before a retry so the lock is free), then let
        # Playwright install its deps and the browser.
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo find /etc/apt -name '*.list' -o -name '*.sources' | \
            xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g'
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-datapilot-timeouts >/dev/null
          apt_update() { sudo timeout --kill-after=10s 4m apt-get update -qq; }
          apt_update || { echo "::warning::apt-get update stalled — retrying once"; \
                          sudo pkill -9 -x apt-get || true; sudo rm -f /var/lib/apt/lists/lock; \
                          sleep 15; apt_update; }
          timeout --kill-after=10s 6m npx playwright install-deps chromium
          timeout --kill-after=10s 6m npx playwright install chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: "true"
          PYTHON: python
          SECRET_KEY: e2e-test-secret-key-for-playwright
          ENV: development
        run: npm run test:e2e

      # Separate config: this one serves the production build with the CSP that
      # runtime-config.js generates. The dev server the job above starts sends no
      # CSP at all, so it cannot test the policy. No backend — the API is stubbed.
      - name: Run CSP rendering tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test --config=playwright.csp.config.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
