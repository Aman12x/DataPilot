[pytest]
markers =
    slow: marks tests that require the MiniLM model or LLM API calls (deselect with -m "not slow")
    integration: marks tests that require external service containers

# Deprecations raised by OUR modules fail the run. --disable-warnings in CI only
# hides the summary, so without this they accumulated silently (the 413 rename
# sat for months). Third-party internals stay warnings: the module field is a
# regex over the module the warning is attributed to, which for a deprecated
# attribute access is the caller (us), and for a library's own internals is the
# library.
filterwarnings =
    error::DeprecationWarning:^(agents|tools|backend|api|memory|auth|config|evals|tests|conftest|test_)
    error::PendingDeprecationWarning:^(agents|tools|backend|api|memory|auth|config|evals|tests|conftest|test_)
    error::FutureWarning:^(agents|tools|backend|api|memory|auth|config|evals|tests|conftest|test_)
    # Starlette's own deprecations subclass UserWarning and are attributed to
    # <sys>, so the module filters above never see them; make them errors
    # outright, except the TestClient/httpx2 notice we cannot act on yet.
    error::starlette.exceptions.StarletteDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
